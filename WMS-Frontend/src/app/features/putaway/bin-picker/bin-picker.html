<div class="fixed inset-0 z-[70] flex items-center justify-center bg-[#081728]/70 p-3 sm:p-6" (click)="close.emit()">
  <section role="dialog" aria-modal="true" aria-labelledby="bin-picker-title" class="flex max-h-[85vh] w-full max-w-xl flex-col overflow-hidden rounded-xl bg-white shadow-2xl" (click)="$event.stopPropagation()">
    <header class="flex items-start justify-between gap-4 border-b border-[#e3eaf3] px-5 py-4">
      <div>
        <h3 id="bin-picker-title" class="text-lg font-bold text-[#14243b]">Select destination Bin</h3>
        <p class="mt-1 text-xs text-[#647590]">Browse the warehouse hierarchy. Only active Bins can be selected.</p>
      </div>
      <button type="button" aria-label="Close Bin picker" class="rounded-md p-2 text-[#52647e] hover:bg-[#f1f5fb] focus-visible:outline-2 focus-visible:outline-[#2458c5]" (click)="close.emit()">✕</button>
    </header>
    <div class="border-b border-[#e3eaf3] px-5 py-4">
      <label for="bin-search" class="mb-1 block text-xs font-semibold text-[#405573]">Search Bin or path</label>
      <input #searchField id="bin-search" type="search" [value]="search()" (input)="onSearch($event)" placeholder="Search locations..." class="h-10 w-full rounded-md border border-[#cdd9e9] px-3 text-sm outline-none focus:border-[#2458c5] focus:ring-2 focus:ring-[#2458c5]/15" />
    </div>
    <div class="min-h-0 flex-1 overflow-y-auto px-3 py-3">
      @for (row of visibleRows(); track row.id) {
        <div class="py-0.5" [style.padding-left.px]="row.depth * 18">
          @if (row.isBin) {
            <button type="button" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-sm text-[#30435f] hover:bg-[#edf4ff] focus-visible:outline-2 focus-visible:outline-[#2458c5] disabled:cursor-not-allowed disabled:opacity-45" [disabled]="excludedIds().includes(row.id)" [attr.aria-label]="'Select ' + row.path" (click)="choose(row)">
              <span class="text-[#2458c5]" aria-hidden="true">▣</span><span class="min-w-0 truncate">{{ row.name }}</span>
              @if (excludedIds().includes(row.id)) { <span class="ml-auto text-xs">Already selected</span> }
            </button>
          } @else {
            <button type="button" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-sm font-semibold text-[#20324d] hover:bg-[#f2f6fb] focus-visible:outline-2 focus-visible:outline-[#2458c5]" [attr.aria-expanded]="!collapsedIds().has(row.id)" (click)="toggle(row.id)">
              <span class="w-3 text-[#647590]" aria-hidden="true">{{ collapsedIds().has(row.id) ? '▸' : '▾' }}</span>{{ row.name }}
            </button>
          }
        </div>
      } @empty {
        <p class="px-3 py-8 text-center text-sm text-[#647590]">No active Bins match your search.</p>
      }
    </div>
  </section>
</div>
