<section class="w-full" aria-labelledby="signup-heading">
  <header>
    <h1 id="signup-heading" class="text-[32px] font-bold tracking-[-0.035em] text-[#091127]">
      Create your account
    </h1>
    <p class="mt-2 text-[15px] text-[#52617a]">Start managing your warehouse with confidence</p>
  </header>

  <form class="mt-9" action="#">
    <div>
      <label class="mb-2 block text-[13px] font-bold text-[#11182b]" for="full-name">
        Full name
      </label>
      <input
        class="h-[52px] w-full rounded-md border border-[#d7deea] bg-white px-4 text-[14px] text-[#11182b] outline-none transition placeholder:text-[#8190a8] focus:border-blue-500 focus:ring-3 focus:ring-blue-100"
        id="full-name"
        name="full-name"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
      />
    </div>

    <div class="mt-5">
      <label class="mb-2 block text-[13px] font-bold text-[#11182b]" for="signup-email">
        Email
      </label>
      <input
        class="h-[52px] w-full rounded-md border border-[#d7deea] bg-white px-4 text-[14px] text-[#11182b] outline-none transition placeholder:text-[#8190a8] focus:border-blue-500 focus:ring-3 focus:ring-blue-100"
        id="signup-email"
        name="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
      />
    </div>

    <div class="mt-5">
      <label class="mb-2 block text-[13px] font-bold text-[#11182b]" for="signup-password">
        Password
      </label>
      <div class="relative">
        <input
          class="h-[52px] w-full rounded-md border border-[#d7deea] bg-white px-4 pr-12 text-[14px] text-[#11182b] outline-none transition placeholder:text-[#8190a8] focus:border-blue-500 focus:ring-3 focus:ring-blue-100"
          id="signup-password"
          name="password"
          type="password"
          placeholder="Create a password"
          autocomplete="new-password"
        />
        <button
          class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-[#33425d]"
          type="button"
          aria-label="Show password"
        >
          <svg
            class="h-5 w-5 fill-none stroke-current stroke-[1.8] [stroke-linecap:round] [stroke-linejoin:round]"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
            <circle cx="12" cy="12" r="2.8" />
          </svg>
        </button>
      </div>
    </div>

    <div class="mt-5">
      <label class="mb-2 block text-[13px] font-bold text-[#11182b]" for="confirm-password">
        Confirm password
      </label>
      <div class="relative">
        <input
          class="h-[52px] w-full rounded-md border border-[#d7deea] bg-white px-4 pr-12 text-[14px] text-[#11182b] outline-none transition placeholder:text-[#8190a8] focus:border-blue-500 focus:ring-3 focus:ring-blue-100"
          id="confirm-password"
          name="confirm-password"
          type="password"
          placeholder="Confirm your password"
          autocomplete="new-password"
        />
        <button
          class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-[#33425d]"
          type="button"
          aria-label="Show confirmed password"
        >
          <svg
            class="h-5 w-5 fill-none stroke-current stroke-[1.8] [stroke-linecap:round] [stroke-linejoin:round]"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
            <circle cx="12" cy="12" r="2.8" />
          </svg>
        </button>
      </div>
    </div>

    <button
      class="mt-8 inline-flex h-[52px] w-full items-center justify-center rounded-md bg-gradient-to-r from-[#2371f9] to-[#0754ee] text-[15px] font-semibold text-white shadow-[0_8px_18px_rgba(8,81,231,0.2)] transition hover:brightness-105"
      type="submit"
    >
      Create Account
    </button>
  </form>

  <p class="mt-8 text-center text-[13px] text-[#637089]">
    Already have an account?
    <a class="ml-1 font-semibold text-[#0759ee] hover:underline" href="/login">Login</a>
  </p>
</section>
