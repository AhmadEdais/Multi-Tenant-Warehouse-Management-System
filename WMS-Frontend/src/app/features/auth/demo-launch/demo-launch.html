<button
  type="button"
  class="inline-flex min-h-12 w-full items-center justify-center rounded-md px-6 text-sm font-semibold transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2458c5] disabled:cursor-not-allowed disabled:opacity-60"
  [class]="variant() === 'primary'
    ? 'bg-[#2458c5] text-white shadow-[0_7px_18px_rgba(36,88,197,0.17)] hover:bg-[#1b49a9]'
    : 'border border-[#cbd8e8] bg-white text-[#243b5c] hover:border-[#2458c5] hover:text-[#2458c5]'"
  [disabled]="isPreparing() || demoStarting()"
  [attr.aria-busy]="isPreparing()"
  (click)="start()"
>
  Try Live Demo
</button>
@if (error(); as message) {
  <p class="mt-2 max-w-md text-sm leading-6 text-red-700" role="alert">{{ message }}</p>
}

@if (isPreparing()) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center bg-[#091a35]/75 px-4 py-8 backdrop-blur-sm" aria-busy="true">
    <div class="w-full max-w-md rounded-xl border border-[#dbe4f0] bg-white px-6 py-8 text-center shadow-2xl sm:px-9 sm:py-10" role="status" aria-live="polite">
      <span class="mx-auto block h-11 w-11 animate-spin rounded-full border-[3px] border-[#d7e5fa] border-t-[#2458c5]" aria-hidden="true"></span>
      <h2 class="mt-6 text-xl font-bold tracking-tight text-[#14243b]">Preparing your demo workspace...</h2>
      <p class="mt-3 text-sm leading-6 text-[#52647e]">We're setting up warehouses, inventory, and sample orders for your private workspace. This may take a moment.</p>
    </div>
  </div>
}
