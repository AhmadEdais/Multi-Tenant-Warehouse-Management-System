<div class="flex items-center rounded hover:bg-[#f2f6fb]">
  <button
    type="button"
    role="menuitem"
    (click)="choose.emit(node())"
    class="min-w-0 flex-1 truncate px-3 py-2 text-left text-sm text-[#20324d] focus-visible:outline-2 focus-visible:outline-[#2458c5]"
  >
    {{ node().name }}
  </button>
  @if (node().children.length) {
    <button
      type="button"
      (click)="toggleChildren($event)"
      [attr.aria-label]="'Show children of ' + node().name"
      [attr.aria-expanded]="expanded()"
      class="flex h-8 w-8 shrink-0 items-center justify-center text-[#52647e] focus-visible:outline-2 focus-visible:outline-[#2458c5]"
    >
      <svg
        class="h-3.5 w-3.5"
        [class.rotate-90]="expanded()"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <path d="m7 4 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  }
</div>
@if (expanded()) {
  <div
    role="menu"
    [attr.aria-label]="'Children of ' + node().name"
    class="fixed z-[70] max-h-[60vh] w-56 overflow-y-auto rounded-md border border-[#d7e1ef] bg-white p-1 shadow-lg"
    [style.top.px]="submenuPosition().top"
    [style.left.px]="submenuPosition().left"
    (click)="$event.stopPropagation()"
  >
    @for (child of node().children; track child.id) {
      <app-category-parent-menu-item
        [node]="child"
        [openLeft]="openLeft()"
        (choose)="choose.emit($event)"
      />
    }
  </div>
}
