<section
  class="overflow-hidden rounded-md border border-[#d7e1ef] bg-white shadow-[0_4px_20px_rgba(24,48,83,0.03)]"
  aria-labelledby="locations-heading"
>
  <header
    class="flex flex-wrap items-center justify-between gap-4 border-b border-[#e3eaf3] px-5 py-5 sm:px-6"
  >
    <div>
      <h2 id="locations-heading" class="text-2xl font-bold tracking-[-0.035em] text-[#14243b]">
        Locations
      </h2>
      <p class="mt-1 text-sm text-[#647590]">
        Manage the physical hierarchy of warehouse locations.
      </p>
    </div>
    <button
      type="button"
      class="inline-flex min-h-11 items-center gap-2 rounded-md bg-[#2458c5] px-5 text-sm font-semibold text-white shadow-sm hover:bg-[#1b49a9] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2458c5]"
    >
      <svg
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <path d="M12 4v16M4 12h16" stroke-linecap="round" />
      </svg>
      Add Location
    </button>
  </header>

  <div class="px-5 py-5 sm:px-6">
    <div class="mb-5 grid gap-3 sm:grid-cols-[minmax(220px,280px)_minmax(0,1fr)]">
      <label class="relative block" for="location-warehouse">
        <span class="pointer-events-none absolute left-3 top-1 text-[11px] text-[#52647e]"
          >Warehouse</span
        >
        <select
          id="location-warehouse"
          disabled
          class="h-11 w-full appearance-none rounded-md border border-[#cdd9e9] bg-white px-3 pb-1 pt-4 text-sm text-[#1b2d48] outline-none disabled:cursor-not-allowed disabled:text-[#6f809a]"
        >
          <option value="">Select a warehouse</option>
        </select>
        <svg
          class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[#52647e]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="m5 9 7 7 7-7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </label>
      <label class="relative block" for="location-search">
        <span class="sr-only">Search locations</span>
        <svg
          class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-[#526988]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" stroke-linecap="round" />
        </svg>
        <input
          id="location-search"
          type="search"
          placeholder="Search by name or barcode..."
          class="h-11 w-full rounded-md border border-[#cdd9e9] bg-white pl-10 pr-3 text-sm text-[#1b2d48] outline-none placeholder:text-[#6f809a] focus:border-[#2458c5] focus:ring-2 focus:ring-[#2458c5]/15"
        />
      </label>
    </div>

    <div class="grid gap-5 lg:grid-cols-[minmax(0,2fr)_minmax(0,3fr)]">
      <section
        class="min-w-0 rounded-md border border-[#dfe7f1]"
        aria-labelledby="hierarchy-heading"
      >
        <header class="border-b border-[#e3eaf3] bg-[#f7f9fd] px-5 py-4">
          <h3 id="hierarchy-heading" class="text-sm font-bold text-[#14243b]">
            Location Hierarchy
          </h3>
        </header>
        <div class="flex min-h-80 items-center justify-center px-5 py-10 text-center">
          <p class="text-sm text-[#647590]">Location hierarchy will appear here.</p>
        </div>
      </section>

      <section class="min-w-0 rounded-md border border-[#dfe7f1]" aria-labelledby="details-heading">
        <header class="border-b border-[#e3eaf3] bg-[#f7f9fd] px-5 py-4">
          <h3 id="details-heading" class="text-sm font-bold text-[#14243b]">Location Details</h3>
        </header>
        <div class="flex min-h-80 flex-col items-center justify-center px-6 py-10 text-center">
          <div
            class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-[#eef4ff] text-[#2458c5]"
            aria-hidden="true"
          >
            <svg
              class="h-6 w-6"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="M12 21s7-5.1 7-11a7 7 0 1 0-14 0c0 5.9 7 11 7 11Z" stroke-linejoin="round" />
              <circle cx="12" cy="10" r="2.5" />
            </svg>
          </div>
          <h4 class="text-base font-semibold text-[#14243b]">Select a location</h4>
          <p class="mt-2 max-w-sm text-sm leading-6 text-[#647590]">
            Choose a location from the hierarchy to view its details and available actions.
          </p>
        </div>
      </section>
    </div>
  </div>
</section>
