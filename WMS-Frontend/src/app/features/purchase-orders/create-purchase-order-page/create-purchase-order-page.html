<div class="space-y-5">
  <button
    type="button"
    [disabled]="submitting()"
    (click)="cancel()"
    class="inline-flex items-center gap-2 text-sm font-semibold text-[#2458c5] hover:underline focus-visible:outline-2 focus-visible:outline-[#2458c5] disabled:opacity-50"
  >
    <span aria-hidden="true">←</span> Purchase Orders
  </button>

  <app-page-header
    title="Create Purchase Order"
    subtitle="Create a draft supplier order for inbound inventory."
  >
    <svg
      pageHeaderIcon
      class="h-6 w-6"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M7 4h10l4 4v12H3V4h4Zm0 5h10M7 13h10M7 17h7" />
    </svg>
  </app-page-header>

  <app-purchase-order-form
    [supplierOptions]="supplierOptions()"
    [warehouseOptions]="warehouseOptions()"
    [suppliersLoading]="suppliersLoading()"
    [warehousesLoading]="warehousesLoading()"
    [suppliersError]="suppliersError()"
    [warehousesError]="warehousesError()"
    [submitting]="submitting()"
    [submitError]="submitError()"
    (retrySuppliers)="loadSuppliers()"
    (retryWarehouses)="loadWarehouses()"
    (save)="submit($event)"
    (cancel)="cancel()"
  />
</div>
