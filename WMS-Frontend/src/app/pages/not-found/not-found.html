<main class="min-h-screen bg-[#fbfcfe] text-[#07152f]">
  <header class="h-[76px] bg-white">
    <div
      class="mx-auto flex h-full w-[calc(100%-32px)] max-w-[1440px] items-center justify-between sm:w-[calc(100%-64px)]"
    >
      <div class="flex items-center gap-2.5" aria-label="WMS Warehouse Management System">
        <svg
          class="h-9 w-9 fill-none stroke-[#145ff4] stroke-[3] [stroke-linecap:round] [stroke-linejoin:round]"
          viewBox="0 0 48 48"
          aria-hidden="true"
        >
          <path d="M24 3 43 13.5v21L24 45 5 34.5v-21L24 3Z" />
          <path
            d="m6 13.5 18 10 18-10M24 23.5V44M14 18.5l20 11M34 18.5 14 29.5M14 29.5v8l10 5.5 10-5.5v-8"
          />
        </svg>
        <span class="flex flex-col leading-none">
          <strong class="text-[20px] tracking-[-0.04em]">WMS</strong>
          <small class="mt-1 hidden text-[8px] text-[#45536e] sm:block">
            Warehouse Management System
          </small>
        </span>
      </div>

      <nav class="flex items-center gap-3 text-xs font-semibold sm:gap-7" aria-label="Page actions">
        <button class="cursor-pointer px-1 py-2 text-[#142039]" type="button">Home</button>
        <button class="cursor-pointer px-1 py-2 text-[#142039]" type="button">Login</button>
      </nav>
    </div>
  </header>

  <section
    class="flex min-h-[calc(100vh-76px)] items-center justify-center px-5 pt-8 pb-20 sm:pt-4 sm:pb-24"
    aria-labelledby="not-found-heading"
  >
    <div class="w-full max-w-[520px] text-center">
      <svg
        class="mx-auto h-auto w-[180px] sm:w-[205px]"
        viewBox="0 0 240 180"
        role="img"
        aria-label="An open package with a paper airplane"
      >
        <path
          d="M106 64c-22-26-53-4-39 19 11 18 43 5 37-17-7-26-44-17-43 11 1 19 23 30 44 24 34-10 51-29 64-52"
          fill="none"
          stroke="#a9c9f8"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-dasharray="4 7"
        />
        <path d="m169 48 41-21-17 37-8-13z" fill="#b7cef1" stroke="#91b2e2" stroke-width="1.5" />
        <path d="m169 48 25-3 16-18-25 24z" fill="#e4edfb" />
        <path d="m185 51 8 13 1-19z" fill="#7fa4dc" />

        <path d="m120 101-34-18 34-17 34 17z" fill="#9bb5d7" />
        <path d="m120 101-34-18-25 21 35 19z" fill="#dce8f7" />
        <path d="m120 101 34-18 25 21-35 19z" fill="#c7d8ed" />
        <path d="m86 83 34 18-24 18-35-15z" fill="#edf3fb" />
        <path d="m154 83-34 18 24 18 35-15z" fill="#e5eef9" />
        <path d="m86 108 34 18v42l-34-20z" fill="#9fb7d6" />
        <path d="m120 126 34-18v40l-34 20z" fill="#7796bd" />
        <path d="m61 104 35 15 24-18-34-18z" fill="#f3f7fc" />
        <path d="m179 104-35 15-24-18 34-18z" fill="#d4e1f1" />
        <path d="M120 126v42" stroke="#6e8db5" stroke-width="1.5" />
      </svg>

      <h1
        id="not-found-heading"
        class="mt-1 text-[72px] leading-none font-extrabold tracking-[-0.055em] text-[#07152f] sm:text-[84px]"
      >
        404
      </h1>
      <h2 class="mt-2 text-[25px] font-bold tracking-[-0.035em] text-[#07152f] sm:text-[28px]">
        Page not found
      </h2>
      <p class="mt-2.5 text-[15px] leading-6 text-[#34425d] sm:text-base">
        The page you're looking for doesn't exist<br />
        or has been moved.
      </p>

      <div class="mx-auto mt-8 grid max-w-[300px] grid-cols-2 gap-3">
        <button
          class="h-11 cursor-pointer rounded-md bg-[#1461f2] px-5 text-sm font-semibold text-white shadow-[0_4px_10px_rgba(20,97,242,0.16)]"
          type="button"
        >
          Go to Home
        </button>
        <button
          class="h-11 cursor-pointer rounded-md border border-[#d2dceb] bg-[#f1f5fa] px-5 text-sm font-semibold text-[#17233b]"
          type="button"
        >
          Back
        </button>
      </div>
    </div>
  </section>
</main>
