<label class="mb-2 block text-[13px] font-bold text-[#11182b]" [for]="inputId()">
  {{ label() }}
</label>

<div class="relative">
  <input
    [formControl]="control()"
    [type]="visible() ? 'text' : 'password'"
    [id]="inputId()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    class="h-[52px] w-full rounded-md border border-[#d7deea] bg-white px-4 pr-12 text-[14px] text-[#11182b] outline-none transition placeholder:text-[#8190a8] focus:border-blue-500 focus:ring-3 focus:ring-blue-100"
  />

  <button
    class="absolute inset-y-0 right-0 flex w-12 cursor-pointer items-center justify-center text-[#33425d]"
    type="button"
    [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
    (click)="toggleVisibility()"
  >
    @if (visible()) {
      <!-- eye-off -->
      <svg class="h-5 w-5 fill-none stroke-current stroke-[1.8]" viewBox="0 0 24 24">
        <path d="M3 3l18 18" />
        <path d="M10.6 10.7a2 2 0 0 0 2.7 2.7" />
        <path d="M9.9 4.2A10.7 10.7 0 0 1 12 4c6 0 9.5 8 9.5 8a15.7 15.7 0 0 1-2.2 3.1" />
        <path d="M6.6 6.6C3.9 8.4 2.5 12 2.5 12s3.5 8 9.5 8a9.8 9.8 0 0 0 4.1-.9" />
      </svg>
    } @else {
      <!-- eye -->
      <svg class="h-5 w-5 fill-none stroke-current stroke-[1.8]" viewBox="0 0 24 24">
        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
        <circle cx="12" cy="12" r="2.8" />
      </svg>
    }
  </button>
</div>
